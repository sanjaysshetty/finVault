name: Frontend Deploy

# Manual-trigger only, same philosophy as backend-deploy.yml. Builds the SPA,
# syncs it to the environment's S3 bucket, and writes a row to the same
# Deployments table the backend workflow uses (component="frontend") so you
# can see "what frontend SHA is live" right next to "what backend SHA is live."
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which environment to deploy"
        type: choice
        options: [dev, sandbox]
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve environment-specific settings
        id: env
        run: |
          if [ "${{ inputs.environment }}" = "sandbox" ]; then
            echo "stack_name=finVault-sb" >> "$GITHUB_OUTPUT"
          else
            echo "stack_name=finVault" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "deployed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Enforce deploying from the matching branch
        run: |
          set -euo pipefail
          # See backend-deploy.yml's identical check for the full rationale.
          if [ "${{ github.ref_name }}" != "${{ inputs.environment }}" ]; then
            echo "ERROR: dispatched from branch '${{ github.ref_name }}' but environment is '${{ inputs.environment }}'. Deploys to '${{ inputs.environment }}' must be dispatched with \"Use workflow from: ${{ inputs.environment }}\" -- this is what enforces promoting via a merged PR into that branch, not deploying another branch's content directly." >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: build
        working-directory: frontend
        run: npm run build
        env:
          VITE_APP_ENV: ${{ inputs.environment }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_COGNITO_DOMAIN: ${{ secrets.VITE_COGNITO_DOMAIN }}
          VITE_COGNITO_CLIENT_ID: ${{ secrets.VITE_COGNITO_CLIENT_ID }}
          VITE_COGNITO_REDIRECT_URI: ${{ secrets.VITE_COGNITO_REDIRECT_URI }}
          VITE_COGNITO_LOGOUT_URI: ${{ secrets.VITE_COGNITO_LOGOUT_URI }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_FRONTEND_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Look up the most recent backend deploy, to cross-link lineage
        id: paired
        env:
          TABLE_NAME: "Deployments-${{ steps.env.outputs.stack_name }}"
          PK: "${{ inputs.environment }}#backend"
        run: |
          set -euo pipefail
          # Deployments-<stack> may not exist yet -- true on a stack's very
          # first deploy through this workflow (e.g. promoting a new
          # environment like sandbox, where the backend deploy that
          # creates this table may not have run yet either). Treat "table
          # doesn't exist" as "no prior deploy" (ITEM=null) rather than
          # letting the query's ResourceNotFoundException fail the whole
          # job; any other AWS error still propagates normally via exit 1.
          #
          # Deliberately NOT using `aws dynamodb describe-table` as a
          # pre-check -- confirmed via a real incident (2026-11-22) that
          # this workflow's own role (AWS_FRONTEND_DEPLOY_ROLE_ARN, scoped
          # to just Query/PutItem on this table) doesn't have
          # DescribeTable, so that pre-check silently failed with
          # AccessDenied and got misread as "table doesn't exist," losing
          # a real paired SHA. Probing with the exact same call (query)
          # that's already permitted avoids needing any extra permission.
          ERR_FILE=$(mktemp)
          if ITEM=$(aws dynamodb query \
              --table-name "$TABLE_NAME" \
              --key-condition-expression "envComponent = :pk" \
              --expression-attribute-values "{\":pk\":{\"S\":\"$PK\"}}" \
              --no-scan-index-forward \
              --limit 1 \
              --query "Items[0]" --output json 2>"$ERR_FILE"); then
            :
          elif grep -q "ResourceNotFoundException" "$ERR_FILE"; then
            ITEM="null"
          else
            cat "$ERR_FILE" >&2
            rm -f "$ERR_FILE"
            exit 1
          fi
          rm -f "$ERR_FILE"
          echo "sha=$(echo "$ITEM" | jq -r '.sha.S // "none"')" >> "$GITHUB_OUTPUT"
          echo "deployed_at=$(echo "$ITEM" | jq -r '.deployedAt.S // "none"')" >> "$GITHUB_OUTPUT"

      - name: sync to S3
        run: aws s3 sync frontend/dist/ "s3://${{ secrets.FRONTEND_BUCKET }}/app/" --delete

      - name: Record this deployment
        env:
          ENV_COMPONENT: "${{ inputs.environment }}#frontend"
          DEPLOYED_AT: ${{ steps.env.outputs.deployed_at }}
          SHA: ${{ steps.env.outputs.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message || 'manual dispatch' }}
          DEPLOYED_BY: ${{ github.actor }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TABLE_NAME: "Deployments-${{ steps.env.outputs.stack_name }}"
          PAIRED_BACKEND_SHA: ${{ steps.paired.outputs.sha }}
          PAIRED_BACKEND_AT: ${{ steps.paired.outputs.deployed_at }}
        run: |
          set -euo pipefail
          jq -n \
            --arg envComponent "$ENV_COMPONENT" \
            --arg deployedAt "$DEPLOYED_AT" \
            --arg sha "$SHA" \
            --arg commitMessage "$COMMIT_MSG" \
            --arg deployedBy "$DEPLOYED_BY" \
            --arg workflowRunUrl "$RUN_URL" \
            --arg pairedBackendSha "$PAIRED_BACKEND_SHA" \
            --arg pairedBackendAt "$PAIRED_BACKEND_AT" \
            '{
              envComponent:     {S: $envComponent},
              deployedAt:       {S: $deployedAt},
              sha:              {S: $sha},
              commitMessage:    {S: $commitMessage},
              deployedBy:       {S: $deployedBy},
              workflowRunUrl:   {S: $workflowRunUrl},
              isRollback:       {BOOL: false},
              verified:         {BOOL: false},
              pairedBackendSha: {S: $pairedBackendSha},
              pairedBackendAt:  {S: $pairedBackendAt}
            }' > item.json
          aws dynamodb put-item --table-name "$TABLE_NAME" --item file://item.json

      - name: Summary
        run: |
          {
            echo "## Frontend deploy — ${{ inputs.environment }}"
            echo "- SHA: \`${{ steps.env.outputs.sha }}\`"
            echo "- Deployed at: ${{ steps.env.outputs.deployed_at }}"
            echo "- Paired backend (most recent at time of this deploy): \`${{ steps.paired.outputs.sha }}\` @ ${{ steps.paired.outputs.deployed_at }}"
            echo ""
            echo "**This is not yet marked verified.** After you've confirmed the app actually works, run \"Mark Deployment Verified\" (environment=${{ inputs.environment }}, component=frontend, sha=${{ steps.env.outputs.sha }})."
          } >> "$GITHUB_STEP_SUMMARY"
