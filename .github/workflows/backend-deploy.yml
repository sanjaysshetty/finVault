name: Backend Deploy

# Manual-trigger only — deploys never fire automatically on merge. You pick the
# environment and click Run. Every run: tags a DynamoDB backup of every durable
# table, deploys, tags the CloudFormation stack with the commit SHA, and writes
# one row to the Deployments table tying {sha, environment, backups} together.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which environment to deploy"
        type: choice
        options: [dev, sandbox]
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve environment-specific settings
        id: env
        run: |
          if [ "${{ inputs.environment }}" = "sandbox" ]; then
            echo "config_env_flag=--config-env sb" >> "$GITHUB_OUTPUT"
            echo "stack_name=finVault-sb" >> "$GITHUB_OUTPUT"
          else
            echo "config_env_flag=" >> "$GITHUB_OUTPUT"
            echo "stack_name=finVault" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "deployed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          # DynamoDB backup names only allow [a-zA-Z0-9_.-] — no colons, so a
          # separate timestamp variant for backup names only.
          echo "backup_ts=$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Back up every durable DynamoDB table, tagged with this deploy's SHA
        id: backups
        run: |
          set -euo pipefail
          TABLES="finAssets StoreReceiptLedger FinAccounts FinAccountMembers FinAccountInvitesV2 PaperTrades"
          ARNS="[]"
          for t in $TABLES; do
            NAME="${t}-${{ inputs.environment }}-${{ steps.env.outputs.sha }}-${{ steps.env.outputs.backup_ts }}"
            ARN=$(aws dynamodb create-backup --table-name "$t" --backup-name "$NAME" --query "BackupDetails.BackupArn" --output text)
            echo "Backed up $t -> $ARN"
            ARNS=$(echo "$ARNS" | jq --arg t "$t" --arg a "$ARN" '. + [{table: $t, backupArn: $a}]')
          done
          echo "backup_arns<<EOF" >> "$GITHUB_OUTPUT"
          echo "$ARNS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: sam build
        working-directory: backend
        run: sam build

      - name: sam deploy
        working-directory: backend
        run: |
          sam deploy ${{ steps.env.outputs.config_env_flag }} \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides "${{ secrets.PARAM_OVERRIDES }}" \
            --tags \
              DeploySha=${{ steps.env.outputs.sha }} \
              DeployedBy=${{ github.actor }} \
              DeployedAt=${{ steps.env.outputs.deployed_at }}

      - name: Record this deployment
        run: |
          aws dynamodb put-item \
            --table-name "Deployments-${{ steps.env.outputs.stack_name }}" \
            --item "{
              \"envComponent\": {\"S\": \"${{ inputs.environment }}#backend\"},
              \"deployedAt\": {\"S\": \"${{ steps.env.outputs.deployed_at }}\"},
              \"sha\": {\"S\": \"${{ steps.env.outputs.sha }}\"},
              \"commitMessage\": {\"S\": ${{ toJSON(github.event.head_commit.message || 'manual dispatch') }}},
              \"deployedBy\": {\"S\": \"${{ github.actor }}\"},
              \"workflowRunUrl\": {\"S\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"},
              \"backups\": {\"S\": ${{ toJSON(steps.backups.outputs.backup_arns) }}}
            }"

      - name: Summary
        run: |
          {
            echo "## Backend deploy — ${{ inputs.environment }}"
            echo "- SHA: \`${{ steps.env.outputs.sha }}\`"
            echo "- Stack: \`${{ steps.env.outputs.stack_name }}\`"
            echo "- Deployed at: ${{ steps.env.outputs.deployed_at }}"
            echo "- Backups taken: $(echo '${{ steps.backups.outputs.backup_arns }}' | jq length)"
          } >> "$GITHUB_STEP_SUMMARY"
