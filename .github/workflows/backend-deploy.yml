name: Backend Deploy

# Manual-trigger only — deploys never fire automatically on merge. You pick the
# environment and click Run. Every run: tags a DynamoDB backup of every durable
# table, deploys, tags the CloudFormation stack with the commit SHA, and writes
# one row to the Deployments table tying {sha, environment, backups} together.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which environment to deploy"
        type: choice
        options: [dev, sandbox]
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve environment-specific settings
        id: env
        run: |
          if [ "${{ inputs.environment }}" = "sandbox" ]; then
            echo "config_env_flag=--config-env sb" >> "$GITHUB_OUTPUT"
            echo "stack_name=finVault-sb" >> "$GITHUB_OUTPUT"
          else
            echo "config_env_flag=" >> "$GITHUB_OUTPUT"
            echo "stack_name=finVault" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "deployed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          # DynamoDB backup names only allow [a-zA-Z0-9_.-] — no colons, so a
          # separate timestamp variant for backup names only.
          echo "backup_ts=$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Look up the most recent frontend deploy, to cross-link lineage
        id: paired
        env:
          TABLE_NAME: "Deployments-${{ steps.env.outputs.stack_name }}"
          PK: "${{ inputs.environment }}#frontend"
        run: |
          set -euo pipefail
          ITEM=$(aws dynamodb query \
            --table-name "$TABLE_NAME" \
            --key-condition-expression "envComponent = :pk" \
            --expression-attribute-values "{\":pk\":{\"S\":\"$PK\"}}" \
            --no-scan-index-forward \
            --limit 1 \
            --query "Items[0]" --output json)
          echo "sha=$(echo "$ITEM" | jq -r '.sha.S // "none"')" >> "$GITHUB_OUTPUT"
          echo "deployed_at=$(echo "$ITEM" | jq -r '.deployedAt.S // "none"')" >> "$GITHUB_OUTPUT"

      - name: Back up every durable DynamoDB table, tagged with this deploy's SHA
        id: backups
        run: |
          set -euo pipefail
          TABLES="finAssets StoreReceiptLedger FinAccounts FinAccountMembers FinAccountInvitesV2 PaperTrades"
          ARNS="[]"
          for t in $TABLES; do
            NAME="${t}-${{ inputs.environment }}-${{ steps.env.outputs.sha }}-${{ steps.env.outputs.backup_ts }}"
            ARN=$(aws dynamodb create-backup --table-name "$t" --backup-name "$NAME" --query "BackupDetails.BackupArn" --output text)
            echo "Backed up $t -> $ARN"
            ARNS=$(echo "$ARNS" | jq -c --arg t "$t" --arg a "$ARN" '. + [{table: $t, backupArn: $a}]')
          done
          echo "backup_arns<<EOF" >> "$GITHUB_OUTPUT"
          echo "$ARNS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Prune on-demand DynamoDB backups older than 90 days
        run: |
          set -euo pipefail
          # Time-based retention here, unlike the ECR image policy below --
          # deliberately different strategy, not an inconsistency. A backup
          # is a passive snapshot never actively referenced by a running
          # resource, so there's no "CloudFormation rolled back to this one"
          # risk the way there is for a live Lambda's container image --
          # deleting an old backup can only foreclose a *future* restore
          # option, never break something currently running. What actually
          # matters is "how long might I plausibly need to notice a data
          # problem and restore to before it" -- a time window, not a count
          # (deploy frequency varies, so "keep last N" could mean losing a
          # 2-week-old backup after a short burst of deploys). 90 days
          # matches the existing precedent already used for the frontend S3
          # bucket's noncurrent-version expiry. Table sizes here are tiny
          # (~660KB combined across all 6 tables, confirmed directly) so
          # this is about avoiding clutter when restoring, not storage cost.
          # BackupCreationDateTime comes back as an ISO8601 string with a
          # timezone offset (e.g. "2026-10-31T15:46:00.844000-05:00"), not
          # a Unix epoch number -- confirmed directly against the real AWS
          # CLI output, not assumed. jq can't compare that against a
          # number, so each timestamp is normalized via `date -d` (GNU
          # date on the ubuntu-latest runner handles the offset correctly)
          # instead of trying to do the date math inside jq.
          RETENTION_DAYS=90
          CUTOFF_EPOCH=$(date -u -d "-${RETENTION_DAYS} days" +%s)
          TABLES="finAssets StoreReceiptLedger FinAccounts FinAccountMembers FinAccountInvitesV2 PaperTrades"
          for t in $TABLES; do
            aws dynamodb list-backups --table-name "$t" --backup-type USER --output json \
              | jq -r '.BackupSummaries[] | "\(.BackupArn)\t\(.BackupCreationDateTime)"' \
              | while IFS=$'\t' read -r arn created; do
                  CREATED_EPOCH=$(date -u -d "$created" +%s)
                  if [ "$CREATED_EPOCH" -lt "$CUTOFF_EPOCH" ]; then
                    echo "Deleting backup older than ${RETENTION_DAYS}d for $t: $arn (created $created)"
                    aws dynamodb delete-backup --backup-arn "$arn"
                  fi
                done
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: sam build
        working-directory: backend
        run: sam build

      - name: sam deploy
        working-directory: backend
        run: |
          sam deploy ${{ steps.env.outputs.config_env_flag }} \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-image-repos \
            --parameter-overrides "${{ secrets.PARAM_OVERRIDES }}" \
            --tags \
              DeploySha=${{ steps.env.outputs.sha }} \
              DeployedBy=${{ github.actor }} \
              DeployedAt=${{ steps.env.outputs.deployed_at }}

      - name: Apply ECR lifecycle policy (keep latest + 1 previous image per repo)
        env:
          STACK_NAME: ${{ steps.env.outputs.stack_name }}
        run: |
          set -euo pipefail
          # countNumber=2 keeps the current image plus one previous one --
          # not pure time-based expiry, deliberately. A Lambda function that
          # goes Inactive from disuse must re-pull its current image on the
          # next invoke; if CloudFormation ever auto-rolls a failed deploy
          # back to the previous image while the (broken) new one is the
          # most recently *pushed*, a time-based or keep-only-1 policy could
          # delete the one the function is actually running on. Keeping 2
          # covers that case. Rollback itself (backend-rollback.yml) rebuilds
          # from source rather than reusing an old pushed image, so older
          # images beyond this safety margin aren't needed for anything.
          POLICY='{"rules":[{"rulePriority":1,"description":"Keep latest + 1 previous image","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":2},"action":{"type":"expire"}}]}'
          for FN in OpportunityEngineFunction DeepDiveWorkerFunction CategorizationFunction ReceiptExtractorFunction TaxDocExtractorFunction; do
            PHYSICAL_NAME=$(aws cloudformation describe-stack-resources --stack-name "$STACK_NAME" --logical-resource-id "$FN" --query "StackResources[0].PhysicalResourceId" --output text)
            IMAGE_URI=$(aws lambda get-function --function-name "$PHYSICAL_NAME" --query "Code.ImageUri" --output text)
            REPO_NAME=$(echo "$IMAGE_URI" | sed -E 's#^[0-9]+\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/##; s#[@:].*$##')
            echo "Applying ECR lifecycle policy to $REPO_NAME (function: $FN)"
            aws ecr put-lifecycle-policy --repository-name "$REPO_NAME" --lifecycle-policy-text "$POLICY"
          done

      - name: Record this deployment
        env:
          ENV_COMPONENT: "${{ inputs.environment }}#backend"
          DEPLOYED_AT: ${{ steps.env.outputs.deployed_at }}
          SHA: ${{ steps.env.outputs.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message || 'manual dispatch' }}
          DEPLOYED_BY: ${{ github.actor }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BACKUPS_JSON: ${{ steps.backups.outputs.backup_arns }}
          TABLE_NAME: "Deployments-${{ steps.env.outputs.stack_name }}"
          PAIRED_FRONTEND_SHA: ${{ steps.paired.outputs.sha }}
          PAIRED_FRONTEND_AT: ${{ steps.paired.outputs.deployed_at }}
        run: |
          set -euo pipefail
          # Build the item via jq (safe JSON-string encoding of every field,
          # regardless of quotes/newlines/special chars) instead of hand-
          # interpolating template expressions into a literal JSON string —
          # that approach broke on the multi-line backups array.
          jq -n \
            --arg envComponent "$ENV_COMPONENT" \
            --arg deployedAt "$DEPLOYED_AT" \
            --arg sha "$SHA" \
            --arg commitMessage "$COMMIT_MSG" \
            --arg deployedBy "$DEPLOYED_BY" \
            --arg workflowRunUrl "$RUN_URL" \
            --arg backups "$BACKUPS_JSON" \
            --arg pairedFrontendSha "$PAIRED_FRONTEND_SHA" \
            --arg pairedFrontendAt "$PAIRED_FRONTEND_AT" \
            '{
              envComponent:      {S: $envComponent},
              deployedAt:        {S: $deployedAt},
              sha:               {S: $sha},
              commitMessage:     {S: $commitMessage},
              deployedBy:        {S: $deployedBy},
              workflowRunUrl:    {S: $workflowRunUrl},
              backups:           {S: $backups},
              isRollback:        {BOOL: false},
              verified:          {BOOL: false},
              pairedFrontendSha: {S: $pairedFrontendSha},
              pairedFrontendAt:  {S: $pairedFrontendAt}
            }' > item.json
          aws dynamodb put-item --table-name "$TABLE_NAME" --item file://item.json

      - name: Summary
        run: |
          {
            echo "## Backend deploy — ${{ inputs.environment }}"
            echo "- SHA: \`${{ steps.env.outputs.sha }}\`"
            echo "- Stack: \`${{ steps.env.outputs.stack_name }}\`"
            echo "- Deployed at: ${{ steps.env.outputs.deployed_at }}"
            echo "- Backups taken: $(echo '${{ steps.backups.outputs.backup_arns }}' | jq length)"
            echo "- Paired frontend (most recent at time of this deploy): \`${{ steps.paired.outputs.sha }}\` @ ${{ steps.paired.outputs.deployed_at }}"
            echo ""
            echo "**This is not yet marked verified.** After you've confirmed the app actually works, run \"Mark Deployment Verified\" (environment=${{ inputs.environment }}, component=backend, sha=${{ steps.env.outputs.sha }})."
          } >> "$GITHUB_STEP_SUMMARY"
