name: Backend CI

# Safety net only — no AWS credentials, no deploy. Just proves `sam build`
# still succeeds for every Lambda function before a PR can merge into
# dev or sandbox.
on:
  pull_request:
    branches: [dev, sandbox]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  sam-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: sam build
        working-directory: backend
        run: sam build
