AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: FinVault API (Prices + Spending + Receipt Processing + Curation + Analytics Export)

Parameters:
  WheelScanAccountId:
    Type: String
    Default: ""
    Description: userId (= accountId) whose account receives the weekly scheduled Wheel Scan report

  OpportunityEngineAccountId:
    Type: String
    Default: ""
    Description: userId (= accountId) whose account receives the weekly scheduled Opportunity Engine scan

  # Existing buckets (NOT created by this stack)
  # No Default — real bucket/table/domain names are resource-identifying info,
  # supplied only via a local, gitignored parameter-overrides file (see CLAUDE.md).
  ReceiptsBucketName:
    Type: String
    Description: "S3 bucket for receipt uploads (not created by this stack)."

  ReceiptsPrefix:
    Type: String
    Default: "receipts/"

  FrontendBucketName:
    Type: String
    Description: "S3 bucket serving the built frontend (not created by this stack)."

  FrontendPrefix:
    Type: String
    Default: "app/"

  # Cognito domains (must be unique in region)
  CognitoDomainPrefixV3:
    Type: String
    Description: "V3 Cognito hosted UI domain prefix (must be unique per region)."

  # Frontend URLs
  FrontendBaseUrlDev:
    Type: String
    Default: "http://localhost:5173/"
    Description: "Dev base URL (used for Cognito logout URL)"

  FrontendBaseUrlProd:
    Type: String
    Default: "https://example.com/app/"
    Description: "Prod base URL (used for Cognito logout URL)"

  FrontendCallbackUrlDev:
    Type: String
    Default: "http://localhost:5173/auth/callback"
    Description: "Dev callback URL (must exactly match Cognito callback URL)"

  FrontendCallbackUrlProd:
    Type: String
    Default: "https://example.com/app/auth/callback"
    Description: "Prod callback URL (must exactly match Cognito callback URL)"

  FinAssetsTableName:
    Type: String
    Description: "Existing DynamoDB table name for Assets module (this stack will not manage it)."

  ReceiptLedgerV2TableName:
    Type: String
    Description: "Stack-managed raw receipt ledger (v2) with DynamoDB Streams enabled."

  MetalsBucketName:
    Type: String
    Description: "S3 bucket containing metal price JSON files (metals/XAU and metals/XAG)"

  StocksSnapshotBucketName:
    Type: String
    Description: "S3 bucket for daily stocks holdings snapshot (stocks-snapshot.json). Private — access via AWS CLI with your finvault-dev credentials."

  SnapshotUserId:
    Type: String
    NoEcho: true
    Description: "Cognito sub (userId) of the account to snapshot daily. Find it in Cognito console → Users → your user → sub attribute."



Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    MemorySize: 256

Resources:
  FinVaultUserPoolV3:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "finvault-userpool-v3-${AWS::StackName}"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email

      # Production-leaning (safe) settings:
      UserPoolAddOns:
        AdvancedSecurityMode: ENFORCED

      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true

      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

      # Standard attributes: email + given_name + family_name
      # Note: making given_name/family_name Required=true means signup MUST provide them.
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: given_name
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: family_name
          AttributeDataType: String
          Required: true
          Mutable: true

      LambdaConfig:
        PostConfirmation: !GetAtt PostConfirmationFunction.Arn

  FinVaultUserPoolClientV3:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "finvault-spa-${AWS::StackName}-v3"
      UserPoolId: !Ref FinVaultUserPoolV3
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      SupportedIdentityProviders:
        - COGNITO
      CallbackURLs:
        - !Ref FrontendCallbackUrlDev
        - !Ref FrontendCallbackUrlProd
      LogoutURLs:
        - !Ref FrontendBaseUrlDev
        - !Ref FrontendBaseUrlProd
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
      PreventUserExistenceErrors: ENABLED

  FinVaultUserPoolDomainV3:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefixV3
      UserPoolId: !Ref FinVaultUserPoolV3

  # -----------------------------
  # HTTP API (JWT-secured by default) - NOW POINTS TO V3
  # -----------------------------
  MetalsHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - content-type
          - authorization
          - x-account-id
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
      RouteSettings:
        "$default":
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 1
      Auth:
        DefaultAuthorizer: CognitoJwtAuthorizer
        Authorizers:
          CognitoJwtAuthorizer:
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${FinVaultUserPoolV3}"
              audience:
                - !Ref FinVaultUserPoolClientV3
            IdentitySource: "$request.header.Authorization"

  # -----------------------------
  # DynamoDB tables
  # -----------------------------
  FinAccountsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: FinAccounts
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: accountId
          AttributeType: S
      KeySchema:
        - AttributeName: accountId
          KeyType: HASH

  FinAccountMembersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: FinAccountMembers
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: accountId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: accountId
          KeyType: HASH
        - AttributeName: userId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  FinAccountInvitesTableV2:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: FinAccountInvitesV2
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: emailLower
          AttributeType: S
        - AttributeName: accountId
          AttributeType: S
        - AttributeName: inviteId
          AttributeType: S
      KeySchema:
        - AttributeName: emailLower
          KeyType: HASH
        - AttributeName: accountId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: accountId-index
          KeySchema:
            - AttributeName: accountId
              KeyType: HASH
            - AttributeName: emailLower
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: inviteId-index
          KeySchema:
            - AttributeName: inviteId
              KeyType: HASH
          Projection:
            ProjectionType: ALL


  FinAssetsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref FinAssetsTableName
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: assetId
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: assetId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  ReceiptLedgerV2TableNew:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref ReceiptLedgerV2TableName
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      StreamSpecification:
        StreamViewType: NEW_IMAGE
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: curationKey
          AttributeType: S
        - AttributeName: curationSort
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: date
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: curationKey
              KeyType: HASH
            - AttributeName: curationSort
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        # UserDateIndex: fixes the silent full-table SCAN on date-range queries.
        # SpendingApi queries this with pk=userId, sk BETWEEN startDate AND endDate.
        - IndexName: UserDateIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: date
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ── Advisor Response Cache ─────────────────────────────────────────────────
  # Short-lived DDB table (TTL 30 min) — stores Claude raw HTML reply keyed by
  # SHA-256(request). Allows frontend to recover the reply on render error without
  # re-invoking the Anthropic API. DeletionPolicy: Delete — ephemeral data only.
  AdvisorCacheTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    Properties:
      TableName: !Sub "AdvisorCache-${AWS::StackName}"
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      AttributeDefinitions:
        - AttributeName: cacheKey
          AttributeType: S
      KeySchema:
        - AttributeName: cacheKey
          KeyType: HASH

  # ── Paper Trading ──────────────────────────────────────────────────────────
  # PaperTradesTable: stores all paper trade records (staged, submitted, filled, etc.)
  # Intentionally separate from any future LiveTradesTable — different table, different Lambda,
  # different routes. The `mode` field is always "PAPER" here.
  #
  # ModeStatusIndex GSI design:
  #   PK = modeStatus (e.g. "PAPER#STAGED") — allows efficient queries by trade lifecycle state
  #   SK = createdAt — supports time-ordered results without a full scan
  #
  PaperTradesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: PaperTrades
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: accountId
          AttributeType: S
        - AttributeName: tradeId
          AttributeType: S
        - AttributeName: modeStatus
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: accountId
          KeyType: HASH
        - AttributeName: tradeId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: ModeStatusIndex
          KeySchema:
            - AttributeName: modeStatus
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # AgentRecommendationsTable: Opportunity Engine / Deep Dive recommendations
  # and their scenario-run history (Part 5/6 agentic rebuild).
  # Not a fit for the single-table finAssets pattern — this is a
  # status-lifecycle entity with sub-record history, modeled like
  # PaperTradesTable above rather than a transaction ledger.
  #
  # Key design:
  #   PK = accountId
  #   SK = "REC#<recId>"                 — recommendation header
  #      | "REC#<recId>#SCENARIO#<ts>"    — one item per scenario run
  #   Query(begins_with(sk, "REC#<recId>")) returns the header + full
  #   scenario-run history in one call.
  #
  # StatusIndex GSI exists for the weekly calibration job, which needs a
  # cross-account scan of resolved (APPROVED/EXPIRED) recommendations.
  #
  # ttl is set only on DISMISSED items (~90-day auto-cleanup) — APPROVED and
  # EXPIRED items are never given a ttl, since they're the calibration
  # ground-truth dataset and auto-deleting them would silently break the
  # only mechanism for checking whether stated probabilities were honest.
  AgentRecommendationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: AgentRecommendations
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: accountId
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: accountId
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: StatusIndex
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # PriceCacheTable: stores the last /prices response with a 60-second application-level TTL.
  # Eliminates duplicate external API calls when multiple page components fetch prices simultaneously.
  # DynamoDB TTL (1 hour) handles cleanup of stale items automatically.
  PriceCacheTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    Properties:
      TableName: !Sub "PriceCache-${AWS::StackName}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: cacheKey
          AttributeType: S
      KeySchema:
        - AttributeName: cacheKey
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ── Deployment traceability log ─────────────────────────────────────────────
  # One row per deploy, written by the GitHub Actions deploy workflows (backend
  # and frontend). Ties together: which commit SHA, which environment, which
  # DynamoDB backups (backend only) were taken right before this deploy, and who
  # ran it. Not stack-scoped by environment on purpose — dev and sandbox are
  # separate AWS accounts/stacks, each gets its own Deployments table instance,
  # but the shape is identical so querying either is the same code path.
  DeploymentsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "Deployments-${AWS::StackName}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: envComponent
          AttributeType: S
        - AttributeName: deployedAt
          AttributeType: S
      KeySchema:
        - AttributeName: envComponent
          KeyType: HASH
        - AttributeName: deployedAt
          KeyType: RANGE

  AnalyticsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: archive-asset-hub-reports
            Status: Enabled
            Prefix: AssetHubReports/
            Transitions:
              - TransitionInDays: 7
                StorageClass: GLACIER

  # Private bucket for daily stocks holdings snapshot.
  # Access via: aws s3 cp s3://<bucket>/stocks-snapshot.json - --profile finvault-dev
  StocksSnapshotBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref StocksSnapshotBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  PricesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: crud/src/
      Handler: handler.handler
      Layers:
        - !Ref FinVaultSharedLayer
        - !Sub '{{resolve:ssm:/aws/service/aws-parameters-and-secrets-lambda-extension/x86/latest}}'
      Environment:
        Variables:
          METALS_BUCKET: !Ref MetalsBucketName
          PRICE_CACHE_TABLE: !Ref PriceCacheTable
          NODE_PATH: /opt/nodejs
      Events:
        Prices:
          Type: HttpApi
          Properties:
            ApiId: !Ref MetalsHttpApi
            Path: /prices
            Method: GET
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref MetalsBucketName
        - DynamoDBCrudPolicy:
            TableName: !Ref PriceCacheTable
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/finvault/finnhub/api-key"

  SpendingApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: crud/spending-api/
      Handler: app.handler
      Timeout: 30
      MemorySize: 256
      Layers:
        - !Ref FinVaultSharedLayer
        - !Sub '{{resolve:ssm:/aws/service/aws-parameters-and-secrets-lambda-extension/x86/latest}}'
      Environment:
        Variables:
          TABLE_NAME: !Ref ReceiptLedgerV2TableName
          DATE_INDEX_NAME: UserDateIndex
          FIN_ACCOUNT_MEMBERS_TABLE: !Ref FinAccountMembersTable
          FIN_ACCOUNTS_TABLE: !Ref FinAccountsTable
          NODE_PATH: /opt/nodejs
          ANTHROPIC_MODEL: "claude-haiku-4-5-20251001"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ReceiptLedgerV2TableName
        - DynamoDBCrudPolicy:
            TableName: !Ref FinAccountMembersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref FinAccountsTable
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/finvault/anthropic/api-key"
      Events:
        SpendingListGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref MetalsHttpApi
            Path: /spending
            Method: GET
        SpendingCreatePost:
          Type: HttpApi
          Properties:
            ApiId: !Ref MetalsHttpApi
            Path: /spending
            Method: POST
        SpendingReceiptGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref MetalsHttpApi
            Path: /spending/receipt/{receipt}
            Method: GET
        SpendingItemPatch:
          Type: HttpApi
          Properties:
            ApiId: !Ref MetalsHttpApi
            Path: /spending/item/{pk}/{sk}
            Method: PATCH
        SpendingItemDelete:
          Type: HttpApi
          Properties:
            ApiId: !Ref MetalsHttpApi
            Path: /spending/item/{pk}/{sk}
            Method: DELETE
        SpendingReceiptDelete:
          Type: HttpApi
          Properties:
            ApiId: !Ref MetalsHttpApi
            Path: /spending/receipt/{receipt}
            Method: DELETE
        SpendingReceiptDatePatch:
          Type: HttpApi
          Properties:
            ApiId: !Ref MetalsHttpApi
            Path: /spending/receipt/{receipt}/date
            Method: PATCH
        SpendingDashboardGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref MetalsHttpApi
            Path: /spending/dashboard
            Method: GET
        SpendingDashboardDetailsGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref MetalsHttpApi
            Path: /spending/dashboard/details
            Method: GET
        SpendingCategorizePost:
          Type: HttpApi
          Properties:
            ApiId: !Ref MetalsHttpApi
            Path: /spending/categorize
            Method: POST

  MetalsSnapshotFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs20.x
      CodeUri: crud/metals-prices/
      Handler: metals-snapshot.handler
      Timeout: 60
      MemorySize: 256
      Layers:
        - !Ref FinVaultSharedLayer
        - !Sub '{{resolve:ssm:/aws/service/aws-parameters-and-secrets-lambda-extension/x86/latest}}'
      Environment:
        Variables:
          METALS_BUCKET: !Ref MetalsBucketName
          NODE_PATH: /opt/nodejs
      Policies:
        - S3WritePolicy:
            BucketName: !Ref MetalsBucketName
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/finvault/goldapi/key"
      Events:
        DailyMetalsSnapshot:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(0 5 * * ? *)"
            ScheduleExpressionTimezone: "America/Chicago"

  StocksSnapshotFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs20.x
      CodeUri: crud/stocks-snapshot/
      Handler: stocks-snapshot.handler
      Timeout: 60
      MemorySize: 256
      Layers:
        - !Ref FinVaultSharedLayer
        - !Sub '{{resolve:ssm:/aws/service/aws-parameters-and-secrets-lambda-extension/x86/latest}}'
      Environment:
        Variables:
          FIN_ASSETS_TABLE: !Ref FinAssetsTableName
          STOCKS_SNAPSHOT_BUCKET: !Ref StocksSnapshotBucketName
          SNAPSHOT_USER_ID: !Ref SnapshotUserId
          NODE_PATH: /opt/nodejs
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref FinAssetsTableName
        - S3WritePolicy:
            BucketName: !Ref StocksSnapshotBucketName
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/finvault/finnhub/api-key"
      Events:
        DailyStocksSnapshot:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(0 5 * * ? *)"
            ScheduleExpressionTimezone: "America/Chicago"

  # Dead Letter Queue for ReceiptExtractor async invocation failures.
  # Failed receipt extraction events land here for inspection / manual replay.
  ReceiptExtractorDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "receipt-extractor-dlq-${AWS::StackName}"
      MessageRetentionPeriod: 1209600  # 14 days

  ReceiptExtractorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ai-services/receipt-extractor/
      Handler: src/handler.handler
      MemorySize: 1024
      Timeout: 60
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt ReceiptExtractorDLQ.Arn
      Layers:
        - !Ref FinVaultSharedLayer
        - !Sub '{{resolve:ssm:/aws/service/aws-parameters-and-secrets-lambda-extension/x86/latest}}'
      Environment:
        Variables:
          NODE_PATH: /opt/nodejs
          RECEIPT_LEDGER_TABLE: !Ref ReceiptLedgerV2TableName
          ANTHROPIC_MODEL: "claude-sonnet-4-6"
      Policies:
        - AWSLambdaBasicExecutionRole
        - S3ReadPolicy:
            BucketName: !Ref ReceiptsBucketName
        - DynamoDBCrudPolicy:
            TableName: !Ref ReceiptLedgerV2TableName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ReceiptExtractorDLQ.QueueName
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/finvault/anthropic/api-key"

  ReceiptUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: crud/receipt-upload-url/
      Handler: src/handler.handler
      Runtime: nodejs20.x
      Timeout: 15
      MemorySize: 256
      Layers:
        - !Ref FinVaultSharedLayer
      Environment:
        Variables:
          RECEIPTS_BUCKET: !Ref ReceiptsBucketName
          RECEIPTS_PREFIX: !Ref ReceiptsPrefix
          PRESIGN_EXPIRES_SECONDS: "300"
          FIN_ACCOUNT_MEMBERS_TABLE: !Ref FinAccountMembersTable
          FIN_ACCOUNTS_TABLE: !Ref FinAccountsTable
          NODE_PATH: /opt/nodejs
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource:
                - !Sub "arn:aws:s3:::${ReceiptsBucketName}/${ReceiptsPrefix}*"
        - DynamoDBCrudPolicy:
            TableName: !Ref FinAccountMembersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref FinAccountsTable
      Events:
        UploadUrlApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref MetalsHttpApi
            Path: /receipts/upload-url
            Method: POST

  FrontendProxyFunction:
    Type: AWS::Serverless::Function
    Properties:
