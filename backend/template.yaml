  # ── Option Marks — Python Lambda (current mid price via yfinance) ────────────
  OptionMarksFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.11
      CodeUri: crud/option-marks/
      Handler: handler.handler
      Timeout: 30
      MemorySize: 256
      Events:
        OptionMarksPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref MetalsHttpApi
            Path: /assets/options/marks
            Method: POST

  # ── Asset Hub — async job pattern (Claude + yfinance, self-invocation) ────────
  AssetHubFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.11
      CodeUri: ai-services/asset-hub/
      Handler: handler.handler
      Timeout: 120
      MemorySize: 512
      Layers:
        - !Ref FinVaultAgentCoreLayer
        - !Sub '{{resolve:ssm:/aws/service/aws-parameters-and-secrets-lambda-extension/x86/latest}}'
      Environment:
        Variables:
          FIN_ASSETS_TABLE: !Ref FinAssetsTableName
          FIN_ACCOUNT_MEMBERS_TABLE: !Ref FinAccountMembersTable
          FIN_ACCOUNTS_TABLE: !Ref FinAccountsTable
          REPORTS_BUCKET: !Ref AnalyticsBucket
          REPORTS_PREFIX: AssetHubReports/
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref FinAssetsTable
        - DynamoDBReadPolicy:
            TableName: !Ref FinAccountMembersTable
        - DynamoDBReadPolicy:
            TableName: !Ref FinAccountsTable
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-AssetHubFunction-*"
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:ListBucket
              Resource:
                - !Sub "arn:aws:s3:::${AnalyticsBucket}"
                - !Sub "arn:aws:s3:::${AnalyticsBucket}/AssetHubReports/*"
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/finvault/anthropic/api-key"
      Events:
        AssetHubAnalyze:
          Type: HttpApi
          Properties:
            ApiId: !Ref MetalsHttpApi
            Path: /assets/hub/analyze
            Method: POST
        AssetHubResult:
          Type: HttpApi
          Properties:
            ApiId: !Ref MetalsHttpApi
            Path: /assets/hub/result/{jobId}
            Method: GET
        AssetHubReports:
          Type: HttpApi
          Properties:
            ApiId: !Ref MetalsHttpApi
            Path: /assets/hub/reports
            Method: GET

  # ── Wheel Scan — Python Lambda (Claude agentic loop + yfinance) ──────────────
  WheelScanFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.11
      CodeUri: ai-services/wheel-scan/
      Handler: handler.handler
      Timeout: 600
      MemorySize: 1024
      Layers:
        - !Ref FinVaultAgentCoreLayer
        - !Sub '{{resolve:ssm:/aws/service/aws-parameters-and-secrets-lambda-extension/x86/latest}}'
      Environment:
        Variables:
          ANALYTICS_BUCKET: !Ref AnalyticsBucket
          WHEEL_PREFIX: WheelReports/
          WHEEL_SCAN_ACCOUNT_ID: !Ref WheelScanAccountId
      Policies:
        - AWSLambdaBasicExecutionRole
        - S3CrudPolicy:
            BucketName: !Ref AnalyticsBucket
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/finvault/anthropic/api-key"
      Events:
        WeeklyWheelScan:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(0 6 ? * SAT *)"
            ScheduleExpressionTimezone: "America/New_York"
            Description: "Weekly Wheel Strategy scan at 6:00am ET, Saturdays"
            State: DISABLED

  # ── Wheel Scan Read — Node.js Lambda (serves reports from S3) ────────────────
  WheelScanReadFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: crud/wheel-scan-read/
      Handler: app.handler
      Timeout: 30
      MemorySize: 256
      Layers:
        - !Ref FinVaultSharedLayer
      Environment:
        Variables:
          ANALYTICS_BUCKET: !Ref AnalyticsBucket
          WHEEL_PREFIX: WheelReports/
          WHEEL_SCAN_FUNCTION: !GetAtt WheelScanFunction.Arn
          FIN_ACCOUNT_MEMBERS_TABLE: !Ref FinAccountMembersTable
          FIN_ACCOUNTS_TABLE: !Ref FinAccountsTable
          NODE_PATH: /opt/nodejs
      Policies:
        - AWSLambdaBasicExecutionRole
        - S3ReadPolicy:
            BucketName: !Ref AnalyticsBucket
        - DynamoDBReadPolicy:
            TableName: !Ref FinAccountMembersTable
        - DynamoDBReadPolicy:
            TableName: !Ref FinAccountsTable
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !GetAtt WheelScanFunction.Arn
      Events:
        WheelScanHistory:
          Type: HttpApi
          Properties:
            ApiId: !Ref MetalsHttpApi
            Path: /wheel/scan/history
            Method: GET
        WheelScanLatest:
          Type: HttpApi
          Properties:
            ApiId: !Ref MetalsHttpApi
            Path: /wheel/scan/latest
            Method: GET
        WheelScanById:
          Type: HttpApi
          Properties:
            ApiId: !Ref MetalsHttpApi
            Path: /wheel/scan/{scanId}
            Method: GET
        WheelScanTrigger:
          Type: HttpApi
          Properties:
            ApiId: !Ref MetalsHttpApi
            Path: /wheel/scan/trigger
            Method: POST

  # ── Opportunity Engine — Part 5/6 agentic rebuild ──────────────────────────
  # Pipeline: deterministic prefilter (relocated from wheel-scan/tools.py,
  # strategy-agnostic) -> Tower 1 (portfolio/risk context) -> Tower 2
  # (AgentLoop ranking pass per shortlisted candidate, concurrent) ->
  # AgentRecommendationsTable. Schedule starts DISABLED, same cautious
  # posture as WheelScanFunction's own schedule, until verified end-to-end
  # against real data (Robinhood MCP in particular needs its own OAuth
  # grant set up before Tower 2's market-data tools are live).
  OpportunityEngineFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.11
      CodeUri: ai-services/opportunity-engine/
      Handler: handler.handler
      Timeout: 900
      MemorySize: 2048
      Layers:
        - !Ref FinVaultAgentCoreLayer
        - !Sub '{{resolve:ssm:/aws/service/aws-parameters-and-secrets-lambda-extension/x86/latest}}'
      Environment:
        Variables:
          FIN_ASSETS_TABLE: !Ref FinAssetsTableName
          FIN_ACCOUNTS_TABLE: !Ref FinAccountsTable
          AGENT_RECOMMENDATIONS_TABLE: !Ref AgentRecommendationsTable
          OPPORTUNITY_ENGINE_ACCOUNT_ID: !Ref OpportunityEngineAccountId
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref AgentRecommendationsTable
        - DynamoDBReadPolicy:
            TableName: !Ref FinAssetsTable
        - DynamoDBReadPolicy:
            TableName: !Ref FinAccountsTable
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/finvault/anthropic/api-key"
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/finvault/robinhood/mcp-access-token"
      Events:
        WeeklyOpportunityScan:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(30 6 ? * SAT *)"
            ScheduleExpressionTimezone: "America/New_York"
            Description: "Weekly Opportunity Engine scan at 6:30am ET, Saturdays"
            State: DISABLED

  # ── Opportunity Engine Read — Node.js Lambda (serves recommendations, triggers scans) ──
  OpportunityEngineReadFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: crud/opportunity-engine-read/
      Handler: app.handler
      Timeout: 30
      MemorySize: 256
      Layers:
        - !Ref FinVaultSharedLayer
      Environment:
        Variables:
          AGENT_RECOMMENDATIONS_TABLE: !Ref AgentRecommendationsTable
          OPPORTUNITY_ENGINE_FUNCTION: !GetAtt OpportunityEngineFunction.Arn
          FIN_ACCOUNT_MEMBERS_TABLE: !Ref FinAccountMembersTable
          FIN_ACCOUNTS_TABLE: !Ref FinAccountsTable
          NODE_PATH: /opt/nodejs
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBReadPolicy:
            TableName: !Ref AgentRecommendationsTable
        - DynamoDBReadPolicy:
            TableName: !Ref FinAccountMembersTable
        - DynamoDBReadPolicy:
            TableName: !Ref FinAccountsTable
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !GetAtt OpportunityEngineFunction.Arn
      Events:
