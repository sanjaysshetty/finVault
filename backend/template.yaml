  TaxReturnApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: crud/tax-return-api/
      Handler: app.handler
      Runtime: nodejs20.x
      Timeout: 15
      MemorySize: 256
      Layers:
        - !Ref FinVaultSharedLayer
      Environment:
        Variables:
          FIN_ASSETS_TABLE:           !Ref FinAssetsTableName
          FIN_ACCOUNT_MEMBERS_TABLE:  !Ref FinAccountMembersTable
          FIN_ACCOUNTS_TABLE:         !Ref FinAccountsTable
          TAX_DOCS_BUCKET:            !Ref TaxDocsBucket
          NODE_PATH:                  /opt/nodejs/node_modules:/opt/nodejs
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref FinAssetsTable
        - DynamoDBReadPolicy:
