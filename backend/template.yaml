  # ── Option Marks — Python Lambda (current mid price via yfinance) ────────────
  OptionMarksFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.11
      CodeUri: crud/option-marks/
      Handler: handler.handler
      Timeout: 30
      MemorySize: 256
      Events:
        OptionMarksPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref MetalsHttpApi
            Path: /assets/options/marks
            Method: POST

  # ── Categorization — the one shared categorization service (Part 7 step 9) ──
  # Direct-invoke only, no API Gateway route. Consolidates 3 independently
  # drifted taxonomies (category-curator's batch job, spending-api's on-demand
  # /spending/categorize route, and formerly receipt-extractor's inline call --
  # that one is deliberately NOT cut over yet, see app.py's module docstring)
  # into one StructuredCall service using category-curator's existing closed
  # 10-category enum as the canonical taxonomy.
  CategorizationFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Timeout: 60
      MemorySize: 512
      # Container-image packaged -- see ReceiptExtractorFunction's comment
      # for the full rationale. No Layers property -- Lambda Layers aren't
      # usable with container images; the shared finvault_agent_core
      # source is copied directly into the image by the Dockerfile instead.
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/finvault/anthropic/api-key"
    Metadata:
      Dockerfile: ai-services/categorization/Dockerfile
      DockerContext: .
      DockerTag: python3.11-v1

  # ── Paper Trade API ───────────────────────────────────────────────────────
  # Fully internal paper trading engine — no broker integration.
  # Fills and mark-to-market use Black-Scholes with 30-day historical volatility
  # from Finnhub candles. Supports stocks and options (SELL_PUT, BUY_CALL, etc.).
  # Auto-fill scheduler runs every 15 minutes via EventBridge.
  PaperTradeApi:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs20.x
      CodeUri: crud/paper-trade-api/
      Handler: app.handler
      Timeout: 60
      MemorySize: 256
      Layers:
        - !Ref FinVaultSharedLayer
        - !Sub '{{resolve:ssm:/aws/service/aws-parameters-and-secrets-lambda-extension/x86/latest}}'
      Environment:
        Variables:
          PAPER_TRADES_TABLE:           !Ref PaperTradesTable
          FIN_ACCOUNT_MEMBERS_TABLE:    !Ref FinAccountMembersTable
          FIN_ACCOUNTS_TABLE:           !Ref FinAccountsTable
          NODE_PATH:                    /opt/nodejs
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref PaperTradesTable
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource: !Sub "${PaperTradesTable.Arn}/index/ModeStatusIndex"
        - DynamoDBReadPolicy:
            TableName: !Ref FinAccountMembersTable
        - DynamoDBReadPolicy:
            TableName: !Ref FinAccountsTable
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/finvault/finnhub/api-key"
      Events:
        PaperTradeListStaged:
          Type: HttpApi
          Properties:
            ApiId: !Ref MetalsHttpApi
            Path: /paper-trade/staged
            Method: GET
        PaperTradeStage:
          Type: HttpApi
          Properties:
            ApiId: !Ref MetalsHttpApi
            Path: /paper-trade/staged
            Method: POST
        PaperTradeDiscard:
          Type: HttpApi
          Properties:
            ApiId: !Ref MetalsHttpApi
            Path: /paper-trade/staged/{tradeId}
            Method: DELETE
        PaperTradeUpdateLimit:
          Type: HttpApi
          Properties:
            ApiId: !Ref MetalsHttpApi
            Path: /paper-trade/staged/{tradeId}
            Method: PATCH
        PaperTradeSubmit:
          Type: HttpApi
          Properties:
            ApiId: !Ref MetalsHttpApi
            Path: /paper-trade/submit/{tradeId}
            Method: POST
        PaperTradeOrders:
          Type: HttpApi
          Properties:
            ApiId: !Ref MetalsHttpApi
            Path: /paper-trade/orders
            Method: GET
        PaperTradeCheckFill:
          Type: HttpApi
          Properties:
            ApiId: !Ref MetalsHttpApi
            Path: /paper-trade/status/{tradeId}
            Method: POST
        PaperTradeClose:
          Type: HttpApi
          Properties:
            ApiId: !Ref MetalsHttpApi
            Path: /paper-trade/close/{tradeId}
            Method: POST
        PaperTradeSnapshot:
          Type: HttpApi
          Properties:
            ApiId: !Ref MetalsHttpApi
            Path: /paper-trade/snapshot/{tradeId}
            Method: GET
        PaperTradeQuote:
          Type: HttpApi
          Properties:
            ApiId: !Ref MetalsHttpApi
            Path: /paper-trade/quote/{ticker}
            Method: GET
        PaperTradeAutoFill:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "rate(15 minutes)"
            ScheduleExpressionTimezone: "America/New_York"

