  # ── Advisor Worker — runs the actual Anthropic call asynchronously ───────────
  # Invoked as InvocationType: Event (fire-and-forget) by AdvisorApi.
  # No API Gateway — no 29s timeout. Up to 5 min for Anthropic to respond.
  # Writes reply (or error) to AdvisorCacheTable so the frontend can poll.
  AdvisorWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ai-services/advisor-api/
      Handler: app.workerHandler
      Timeout: 300
      MemorySize: 512
      Layers:
        - !Ref FinVaultSharedLayer
        - !Sub '{{resolve:ssm:/aws/service/aws-parameters-and-secrets-lambda-extension/x86/latest}}'
      Environment:
        Variables:
          FIN_ASSETS_TABLE: !Ref FinAssetsTableName
          FIN_ACCOUNT_MEMBERS_TABLE: !Ref FinAccountMembersTable
          FIN_ACCOUNTS_TABLE: !Ref FinAccountsTable
          ANALYTICS_BUCKET: !Ref AnalyticsBucket
          ADVISOR_CACHE_TABLE: !Ref AdvisorCacheTable
          NODE_PATH: /opt/nodejs/node_modules:/opt/nodejs
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBReadPolicy:
            TableName: !Ref FinAssetsTableName
        - DynamoDBReadPolicy:
            TableName: !Ref FinAccountMembersTable
        - DynamoDBReadPolicy:
            TableName: !Ref FinAccountsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AdvisorCacheTable
        - S3ReadPolicy:
            BucketName: !Ref AnalyticsBucket
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/finvault/anthropic/api-key"

  # ── Advisor API — handles auth, cache lookup, async dispatch ─────────────────
  # POST /advisor/chat  → checks DDB cache; on miss fires AdvisorWorkerFunction
  #   async and returns 202 { jobId, status: "pending" } within ~200ms.
  # GET  /advisor/cache/:key → returns cached reply; 404 = still pending.
  AdvisorApi:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ai-services/advisor-api/
      Handler: app.handler
      Timeout: 15
      MemorySize: 512
      Layers:
        - !Ref FinVaultSharedLayer
      Environment:
        Variables:
          FIN_ASSETS_TABLE: !Ref FinAssetsTableName
          FIN_ACCOUNT_MEMBERS_TABLE: !Ref FinAccountMembersTable
          FIN_ACCOUNTS_TABLE: !Ref FinAccountsTable
          ANALYTICS_BUCKET: !Ref AnalyticsBucket
          ADVISOR_CACHE_TABLE: !Ref AdvisorCacheTable
          ADVISOR_WORKER_FUNCTION: !GetAtt AdvisorWorkerFunction.Arn
          NODE_PATH: /opt/nodejs/node_modules:/opt/nodejs
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBReadPolicy:
            TableName: !Ref FinAssetsTableName
        - DynamoDBReadPolicy:
            TableName: !Ref FinAccountMembersTable
        - DynamoDBReadPolicy:
            TableName: !Ref FinAccountsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AdvisorCacheTable
        - S3ReadPolicy:
            BucketName: !Ref AnalyticsBucket
        - LambdaInvokePolicy:
            FunctionName: !Ref AdvisorWorkerFunction
      Events:
        AdvisorChat:
          Type: HttpApi
          Properties:
            ApiId: !Ref MetalsHttpApi
            Path: /advisor/chat
            Method: POST
        AdvisorCacheGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref MetalsHttpApi
            Path: /advisor/cache/{cacheKey}
            Method: GET

  # ── Paper Trade API ───────────────────────────────────────────────────────
  # Fully internal paper trading engine — no broker integration.
  # Fills and mark-to-market use Black-Scholes with 30-day historical volatility
  # from Finnhub candles. Supports stocks and options (SELL_PUT, BUY_CALL, etc.).
  # Auto-fill scheduler runs every 15 minutes via EventBridge.
  PaperTradeApi:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: crud/paper-trade-api/
      Handler: app.handler
      Timeout: 60
      MemorySize: 256
      Layers:
        - !Ref FinVaultSharedLayer
        - !Sub '{{resolve:ssm:/aws/service/aws-parameters-and-secrets-lambda-extension/x86/latest}}'
      Environment:
        Variables:
          PAPER_TRADES_TABLE:           !Ref PaperTradesTable
          FIN_ACCOUNT_MEMBERS_TABLE:    !Ref FinAccountMembersTable
          FIN_ACCOUNTS_TABLE:           !Ref FinAccountsTable
          NODE_PATH:                    /opt/nodejs
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref PaperTradesTable
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource: !Sub "${PaperTradesTable.Arn}/index/ModeStatusIndex"
        - DynamoDBReadPolicy:
            TableName: !Ref FinAccountMembersTable
        - DynamoDBReadPolicy:
            TableName: !Ref FinAccountsTable
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/finvault/finnhub/api-key"
      Events:
        PaperTradeListStaged:
          Type: HttpApi
          Properties:
            ApiId: !Ref MetalsHttpApi
            Path: /paper-trade/staged
            Method: GET
        PaperTradeStage:
          Type: HttpApi
          Properties:
            ApiId: !Ref MetalsHttpApi
            Path: /paper-trade/staged
            Method: POST
        PaperTradeDiscard:
          Type: HttpApi
          Properties:
            ApiId: !Ref MetalsHttpApi
            Path: /paper-trade/staged/{tradeId}
            Method: DELETE
        PaperTradeUpdateLimit:
          Type: HttpApi
          Properties:
            ApiId: !Ref MetalsHttpApi
            Path: /paper-trade/staged/{tradeId}
            Method: PATCH
        PaperTradeSubmit:
          Type: HttpApi
          Properties:
            ApiId: !Ref MetalsHttpApi
            Path: /paper-trade/submit/{tradeId}
            Method: POST
        PaperTradeOrders:
          Type: HttpApi
          Properties:
            ApiId: !Ref MetalsHttpApi
            Path: /paper-trade/orders
            Method: GET
        PaperTradeCheckFill:
          Type: HttpApi
          Properties:
            ApiId: !Ref MetalsHttpApi
            Path: /paper-trade/status/{tradeId}
            Method: POST
        PaperTradeClose:
          Type: HttpApi
          Properties:
            ApiId: !Ref MetalsHttpApi
            Path: /paper-trade/close/{tradeId}
            Method: POST
        PaperTradeSnapshot:
          Type: HttpApi
          Properties:
            ApiId: !Ref MetalsHttpApi
            Path: /paper-trade/snapshot/{tradeId}
            Method: GET
        PaperTradeQuote:
          Type: HttpApi
          Properties:
            ApiId: !Ref MetalsHttpApi
            Path: /paper-trade/quote/{ticker}
            Method: GET
        PaperTradeAutoFill:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "rate(15 minutes)"
            ScheduleExpressionTimezone: "America/New_York"

  # ── Budget & Goals API ────────────────────────────────────────────────────
