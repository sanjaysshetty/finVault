  FinVaultSharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "finvault-shared-${AWS::StackName}"
      Description: Shared utilities for FinVault Lambdas
      ContentUri: layers/finvault-shared/
      CompatibleRuntimes:
        - nodejs20.x
      RetentionPolicy: Retain
    Metadata:
      BuildMethod: nodejs20.x

  # No automatic trigger (manual invoke only) -- its DailyCuration ScheduleV2
  # was removed 2026-10-26 after an unattended run of a different AI service
  # (the now-removed Opportunity Engine) burned through the Anthropic
  # account's credit balance in a single invocation. No scheduled runs for any AI-calling
  # Lambda (this one invokes CategorizationFunction) until cost guardrails
  # are in place and verified. Re-add the schedule deliberately, not as a
  # side effect of an unrelated template change.
  CurateBatchFunction:
    Type: AWS::Serverless::Function
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Runtime: nodejs20.x
      CodeUri: ai-services/category-curator/
      Handler: curate-incremental.handler
      MemorySize: 1024
      Timeout: 900
      Layers:
        - !Ref FinVaultSharedLayer
      Environment:
        Variables:
          NODE_PATH: /opt/nodejs
          TABLE: !Ref ReceiptLedgerV2TableNew
          SCAN_LIMIT: "200"
          STOP_BUFFER_MS: "30000"
          CATEGORIZATION_FUNCTION: !GetAtt CategorizationFunction.Arn
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ReceiptLedgerV2TableNew
        - LambdaInvokePolicy:
            FunctionName: !Ref CategorizationFunction

