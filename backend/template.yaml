          TABLE: !Ref ReceiptLedgerV2TableNew
          MODEL: "claude-haiku-4-5-20251001"
          CONCURRENCY: "5"
          SCAN_LIMIT: "200"
          STOP_BUFFER_MS: "30000"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ReceiptLedgerV2TableNew
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/finvault/anthropic/api-key"
      Events:
        DailyCuration:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(0 5 * * ? *)"
            ScheduleExpressionTimezone: "America/Chicago"

