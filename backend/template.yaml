          Type: HttpApi
          Properties:
            ApiId: !Ref MetalsHttpApi
            Path: /tax-return/documents/{docId}/download-url
            Method: GET

  # Dead Letter Queue — captures failed S3-async Lambda invocations for inspection/retry
  TaxDocExtractorDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "tax-doc-extractor-dlq-${AWS::StackName}"
      MessageRetentionPeriod: 1209600  # 14 days

  TaxDocExtractorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ai-services/tax-return-extractor/
      Handler: app.handler
      Runtime: nodejs20.x
      Timeout: 60
      MemorySize: 1024
      Layers:
        - !Ref FinVaultSharedLayer
        - !Sub '{{resolve:ssm:/aws/service/aws-parameters-and-secrets-lambda-extension/x86/latest}}'
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt TaxDocExtractorDLQ.Arn
      Environment:
        Variables:
          FIN_ASSETS_TABLE:          !Ref FinAssetsTableName
          FIN_ACCOUNT_MEMBERS_TABLE: !Ref FinAccountMembersTable
          FIN_ACCOUNTS_TABLE:        !Ref FinAccountsTable
          ANTHROPIC_MODEL:           "claude-sonnet-4-6"
          NODE_PATH:                 /opt/nodejs/node_modules:/opt/nodejs
      Policies:
        - AWSLambdaBasicExecutionRole
        # Use !Sub ARN (not !Ref TaxDocsBucket) so there is no CloudFormation dependency
        # from this Lambda back to TaxDocsBucket — breaking the circular dep.
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:HeadObject
              Resource: !Sub "arn:aws:s3:::finvault-tax-docs-${AWS::AccountId}/*"
        - DynamoDBCrudPolicy:
            TableName: !Ref FinAssetsTable
        - DynamoDBReadPolicy:
            TableName: !Ref FinAccountMembersTable
        - DynamoDBReadPolicy:
            TableName: !Ref FinAccountsTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt TaxDocExtractorDLQ.QueueName
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/finvault/anthropic/api-key"
      # No Events: block — S3 notification is wired directly on TaxDocsBucket below.
      # SAM's Type:S3 event on a same-stack bucket creates a circular dependency
      # (Lambda policy → !Ref Bucket, Bucket notification → Lambda Arn → circular).
      # Instead: explicit Lambda::Permission + DependsOn + NotificationConfiguration.

  # Allow S3 to invoke the extractor. SourceArn uses !Sub (not !GetAtt TaxDocsBucket.Arn)
  # so this permission has no CloudFormation dep on TaxDocsBucket.
  TaxDocExtractorLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt TaxDocExtractorFunction.Arn
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:aws:s3:::finvault-tax-docs-${AWS::AccountId}"

  # Bucket defined AFTER the Lambda permission so the notification config can be set
  # atomically with the bucket creation. DependsOn ensures the Lambda permission exists
  # before S3 tries to validate it during bucket creation.
  TaxDocsBucket:
    Type: AWS::S3::Bucket
    DependsOn: TaxDocExtractorLambdaPermission
    Properties:
      BucketName: !Sub "finvault-tax-docs-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [PUT, GET]
            AllowedOrigins: ["*"]
            MaxAge: 3600
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt TaxDocExtractorFunction.Arn


# ─────────────────────────────────────────────────────────────────────────────
# Phase 4 — Item 5: S3 Lifecycle for metals price snapshots
#
# The MetalsBucket (daily-metal-prices-1152) is a pre-existing bucket not managed
# by this stack, so lifecycle rules cannot be set via CloudFormation without
# importing the bucket.
#
# Run this ONE-TIME AWS CLI command after deployment to expire snapshots > 365 days:
#
#   aws s3api put-bucket-lifecycle-configuration \
#     --bucket daily-metal-prices-1152 \
#     --lifecycle-configuration '{
#       "Rules": [{
#         "ID": "expire-old-metal-prices",
#         "Status": "Enabled",
#         "Filter": { "Prefix": "metals/" },
#         "Expiration": { "Days": 365 }
#       }]
#     }' \
#     --profile finvault-sb
# ─────────────────────────────────────────────────────────────────────────────


Outputs:
  ApiBaseUrl:
    Description: "HTTP API base URL"
    Value: !Sub "https://${MetalsHttpApi}.execute-api.${AWS::Region}.amazonaws.com"

  # V3 Cognito outputs (use these in your frontend .env)
  CognitoUserPoolIdV3:
    Value: !Ref FinVaultUserPoolV3

  CognitoUserPoolClientIdV3:
    Value: !Ref FinVaultUserPoolClientV3

  CognitoDomainPrefixV3Out:
    Value: !Ref CognitoDomainPrefixV3

  AnalyticsBucketName:
    Description: "S3 analytics bucket"
    Value: !Ref AnalyticsBucket

  ReceiptLedgerV2TableNameOut:
    Description: "ReceiptLedgerV2 table name"
    Value: !Ref ReceiptLedgerV2TableNew

  ReceiptLedgerV2StreamArnOut:
    Description: "ReceiptLedgerV2 stream ARN"
    Value: !GetAtt ReceiptLedgerV2TableNew.StreamArn

  FinAccountsTableName:
    Value: !Ref FinAccountsTable

  FinAccountMembersTableName:
    Value: !Ref FinAccountMembersTable

  FinAccountInvitesTableV2Name:
    Value: !Ref FinAccountInvitesTableV2

  StocksSnapshotBucketNameOut:
    Description: "Private S3 bucket for daily stocks snapshot. Read via: aws s3 cp s3://<bucket>/stocks-snapshot.json - --profile finvault-dev"
    Value: !Ref StocksSnapshotBucket
